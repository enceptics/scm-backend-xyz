{% extends 'base.html' %}

{% block content %}
    <div class="container mt-4 text-center">
        <h2 class="text-success">
            <i class="fas fa-check-circle"></i> Success
        </h2>
        <p>Your request has been processed successfully.</p>
        <p>Please stay put for the next steps.</p>

        <button onclick="goBack()" class="btn btn-primary mt-3">
            <i class="fas fa-arrow-left"></i> Go Back
        </button>
    </div>

    <script>
        function goBack() {
            if (document.referrer) {
                window.location.href = document.referrer; // Navigate back to the previous page and reload
            } else {
                window.history.back();
                setTimeout(() => window.location.reload(), 500); // Force reload if history.back() doesn't work
            }
        }
    </script>
{% endblock %}
