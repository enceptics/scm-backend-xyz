{% extends 'base.html' %}

{% block title %}Operation Successful{% endblock %}

{% block content %}

        <div class="row justify-content-cente">
            <div class="col-md-6 text-center">
                <i class="fas fa-check-circle" style="font-size: 64px; color: #28a745;"></i>

        }

{% endblock %}
