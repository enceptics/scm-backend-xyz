<!-- edit_profile_picture.html -->
{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-3">
    <div class="row justify-content-cente">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">Edit Profile Picture</div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="id_profile_picture">Profile Picture</label>
                            <input type="file" class="form-control-file" id="id_profile_picture" name="profile_picture">
                            {% if form.instance.profile_picture %}
                                <img src="{{ form.instance.profile_picture.url }}" class="img-fluid mt-3" alt="Current Profile Picture">
                            {% else %}
                                <p>No profile picture available</p>
                            {% endif %}
                        </div>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
