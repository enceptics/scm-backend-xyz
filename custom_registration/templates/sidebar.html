{% load static %}

<style>
/* Logo Styles */
.sidebar-brand {
    background-color: #001b42; /* Navy blue background */
    border-radius: 8px; /* Rounded corners */
    box-shadow: 0 4px 8px rgba(255, 255, 0, 0.4); /* Box shadow for depth */
    text-decoration: none; /* Remove underline */
    color: #fff; /* White text color */
    border-radius: 30px;
    margin: 5px;
    transition: background-color 0.3s ease; /* Smooth hover transition */
    font-family: 'Poppins', sans-serif; /* Modern Google Font */
}

.sidebar-brand:hover {
    background-color: #e6b800; /* Slightly darker on hover */
}

.sidebar-brand-icon {
    margin-right: 10px;
    transform: rotate(-15deg); /* Rotate icon */
}

.sidebar-brand-text {
    font-size: 1rem; /* Slightly larger text */
    font-weight: 100; /* Semi-bold for emphasis */
}

/* Optional: Icon color */
.sidebar-brand-icon i {
    color: #fff;
}

/* Styles for the sidebar */
.sidebar {
    display: block; 
    transition: transform 0.3s ease; /* Smooth transition for hiding */
}
</style>

<ul class="navbar-nav bg-gradient sidebar sidebar-dark accordion" id="accordionSidebar" style="background-color: #001b42;">

    <!-- Sidebar - Brand -->
    <a class="sidebar-brand d-flex align-items-center justify-content-center mb-4 mt-2" href="{% url 'home' %}">
        <div class="sidebar-brand-icon rotate-n-15">
            <i class="fas fa-globe-africa"></i> <!-- Globe Icon -->
        </div>
        <div class="sidebar-brand-text mx-3" style="letter-spacing: 5px;">Intellima</div>
    </a>

    <!-- Other sidebar items go here -->

    <!-- Sidebar Toggler (Sidebar) -->
    <div class="text-center d-none d-md-inline">
        <button class="rounded-circle border-0" id="sidebarToggl"></button>
    </div>
</ul>

<script>
    // JavaScript to hide the sidebar on scroll
    let lastScrollTop = 0;
    const sidebar = document.getElementById('accordionSidebar');

    window.addEventListener('scroll', function() {
        let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollTop > lastScrollTop) {
            sidebar.style.transform = 'translateX(-100%)'; // Hide sidebar
        } else {
            sidebar.style.transform = 'translateX(0)'; // Show sidebar
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; // For Mobile or negative scrolling
    });
</script>
