{% extends 'base.html' %}

{% block content %}
        <div class="col-xl-10 col-lg-12 col-md-9 mt-n4">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0" style="min-height: 60vh;">
                    <!-- Nested Row within Card Body -->
                    <div class="row">
                        <div class="col-lg-6 d-none d-lg-block bg-login-image mt-2" style="background-size: cover; background-position: center;"></div>
                        <div class="col-lg-6">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">Password Reset Confirmation</h1>
                                </div>
                                <form method="post">
                                    {% csrf_token %}
                                    {{ form.as_p }}
                                    <button type="submit" class="btn btn-primary">Reset Password</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
{% endblock %}
